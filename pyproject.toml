[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-tracker"
version = "1.0.0"
description = "Desktop app to visualise investment accounts from monthly CSV files"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Investment Tracker"}]
dependencies = [
  "PySide6>=6.6",
  "pandas>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
investment-tracker = "investment_tracker.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
